<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Join class · ChatGPT for Teachers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal: #0c6e66;
      --amber: #c44e10;
      --paper: #f6edd8;
      --ink: #1c1915;
      --ink-soft: #5c564c;
      --surface: #fffaf0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Source Sans 3", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
    }
    h1, h2, .display { font-family: Fraunces, Georgia, serif; font-weight: 500; letter-spacing: -0.02em; }
    button { font: inherit; cursor: pointer; }
    .kicker { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }
    #app { min-height: 100dvh; display: flex; flex-direction: column; }
    .join {
      background: var(--amber);
      color: var(--paper);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 1.25rem calc(2rem + env(safe-area-inset-bottom));
    }
    .join .card {
      background: var(--surface);
      color: var(--ink);
      border-radius: 14px;
      padding: 1.25rem;
      margin-top: 1.5rem;
    }
    input, textarea {
      width: 100%;
      min-height: 48px;
      border: 1px solid #e4d9c4;
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 7rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; width: 100%; border: 0; border-radius: 8px;
      padding: 0 1rem; font-weight: 600;
      background: var(--teal); color: #fff;
    }
    .btn[disabled] { opacity: 0.45; }
    header.follow {
      background: var(--amber); color: var(--paper);
      padding: 0.85rem 1rem;
    }
    .stage { flex: 1; padding: 1.25rem 1rem 6rem; max-width: 40rem; margin: 0 auto; width: 100%; }
    .item { display: grid; grid-template-columns: 1.5rem 1fr; gap: 0.4rem 0.7rem; margin-top: 0.85rem; }
    .item .n { color: var(--teal); font-family: Fraunces, serif; font-size: 1.15rem; }
    footer.bar {
      position: sticky; bottom: 0;
      background: var(--amber); color: var(--paper);
      padding: 0.85rem 1rem calc(0.85rem + env(safe-area-inset-bottom));
    }
    .note {
      margin-top: 1.25rem; padding: 1rem;
      background: #fff; border-radius: 12px;
      box-shadow: 0 0 0 1px #eadfcb;
    }
    .err { color: #9b1c1c; font-size: 0.9rem; }
    .wait { opacity: 0.85; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const BUS_HOSTS = [
      "https://ntfy.adminforge.de",
      "https://ntfy.envs.net",
      "https://ntfy.mzte.de",
    ];
    const CONTENT_URLS = [
      "content.json",
      "https://cdn.jsdelivr.net/gh/ManoliMeletiou/chatgpt-for-teachers@main/docs/content.json",
    ];
    const TOPIC = (code) => "cftnl" + String(code).toUpperCase().replace(/[^A-Z0-9]/g, "").toLowerCase();
    const params = new URLSearchParams(location.search);
    const hashCode = (location.hash.match(/join\/([A-Za-z0-9]+)/i) || [])[1];
    const pathCode = (location.pathname.match(/join\/([A-Za-z0-9]+)/i) || [])[1];
    let code = (params.get("c") || hashCode || pathCode || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    const app = document.getElementById("app");
    let content = null;
    let live = null;
    let name = sessionStorage.getItem("cft-guest-name") || "";
    let joined = false;
    let notes = {};
    try { notes = JSON.parse(sessionStorage.getItem("cft-notes") || "{}"); } catch (e) { notes = {}; }

    function displayCode(c) {
      const n = String(c || "").toUpperCase();
      return n.length === 6 ? n.slice(0, 3) + " " + n.slice(3) : n;
    }
    function moduleOf(id) {
      if (!content || !id) return null;
      return content.modules.find((m) => m.id === id || m.slug === id) || null;
    }
    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, (ch) => {
        if (ch === "&") return "&" + "amp;";
        if (ch === "<") return "&" + "lt;";
        if (ch === ">") return "&" + "gt;";
        if (ch === '"') return "&" + "quot;";
        return "&#39;";
      });
    }

    function payloadFromEvent(event) {
      if (!event || typeof event !== "object") return null;
      if (event.event && event.event !== "message") return null;
      if (!event.message) return null;
      try {
        const payload = JSON.parse(event.message);
        if (payload && payload.v === 1 && payload.code) return payload;
      } catch (e) {}
      return null;
    }

    async function pullFrom(host, topic) {
      const res = await fetch(host + "/" + topic + "/json?poll=1", { cache: "no-store" });
      if (!res.ok) return null;
      const text = await res.text();
      const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
      for (let i = lines.length - 1; i >= 0; i--) {
        try {
          const parsed = payloadFromEvent(JSON.parse(lines[i]));
          if (parsed) return parsed;
        } catch (e) {}
      }
      return null;
    }

    async function pullLive() {
      if (!code) return null;
      const topic = TOPIC(code);
      const rows = await Promise.all(BUS_HOSTS.map((host) => pullFrom(host, topic).catch(() => null)));
      let best = null;
      for (const row of rows) {
        if (!row || row.status === "ended") continue;
        if (!best || (row.at || 0) >= (best.at || 0)) best = row;
      }
      return best;
    }

    function renderJoin(message) {
      app.innerHTML =
        '<main class="join">' +
          '<p class="kicker wait">' + (code ? "Joining " + displayCode(code) : "Join a live class") + "</p>" +
          '<h1 class="display" style="font-size:2rem;margin:0.4rem 0 0">' +
            (live ? escapeHtml(live.title) : "You are on the live class page.") +
          "</h1>" +
          '<p style="opacity:.9;max-width:28rem">' +
            (live
              ? "Type your name, then you stay on the presenter\u2019s slide."
              : (message || "This is the public join page \u2014 not a draft. Open the room on the presenting laptop, then enter.")) +
          "</p>" +
          '<form class="card" id="form">' +
            (code ? "" : '<label class="kicker" style="color:#5c564c">Class code</label><input id="codein" placeholder="L7S M9Y" value="' + escapeHtml(code) + '" autocomplete="off" />') +
            '<label class="kicker" style="color:#5c564c;display:block;margin-top:' + (code ? "0" : "0.9rem") + '">Your name</label>' +
            '<input id="namein" placeholder="First name" value="' + escapeHtml(name) + '" autocomplete="name" />' +
            '<p class="err" id="err"></p>' +
            '<button class="btn" style="margin-top:0.9rem" type="submit">' + (live ? "Enter the class" : "Look up this class") + "</button>" +
            '<p style="font-size:0.9rem;color:#5c564c;margin:0.8rem 0 0">Use your own phone \u2014 not the presenting laptop. No sign-in.</p>' +
          "</form>" +
        "</main>";
      document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        const err = document.getElementById("err");
        if (!code) {
          code = (document.getElementById("codein").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
        }
        name = (document.getElementById("namein").value || "").trim();
        if (code.length !== 6) { err.textContent = "Enter the six-character code."; return; }
        if (name.length < 2) { err.textContent = "Type the name the presenter should see."; return; }
        sessionStorage.setItem("cft-guest-name", name);
        const snap = await pullLive();
        if (!snap) { err.textContent = "That code is not live yet. Wait for the presenter to open the room, then try again."; return; }
        live = snap;
        joined = true;
        history.replaceState({}, "", "?c=" + code);
        renderStage();
      };
    }

    function renderStage() {
      const mod = moduleOf(live.moduleId);
      const slides = mod ? mod.slides : [];
      const i = Math.min(live.slide || 0, Math.max(0, slides.length - 1));
      const slide = slides[i];
      const key = (mod && mod.id) + ":" + i;
      app.innerHTML =
        '<header class="follow">' +
          '<p class="kicker" style="margin:0;opacity:.85">Following ' + displayCode(code) + (name ? " · " + escapeHtml(name) : "") + "</p>" +
          '<h1 class="display" style="margin:0.15rem 0 0;font-size:1.2rem">' + (mod ? escapeHtml(mod.title) : "Waiting for the next slide") + "</h1>" +
        "</header>" +
        '<div class="stage">' +
          (slide
            ? '<p class="kicker" style="color:var(--teal);margin:0">Slide ' + (i + 1) + " of " + slides.length + "</p>" +
              '<h2 class="display" style="font-size:1.7rem;margin:0.35rem 0 0.7rem">' + escapeHtml(slide.title) + "</h2>" +
              (slide.paras || []).map((p) => "<p>" + escapeHtml(p) + "</p>").join("") +
              (slide.items || []).map((it) =>
                '<div class="item"><div class="n">' + escapeHtml(it.n) + "</div><div><strong>" +
                escapeHtml(it.title) + '</strong><div style="color:#5c564c">' + escapeHtml(it.body) +
                "</div></div></div>"
              ).join("") +
              (slide.avoid ? "<p><strong>Risky habit.</strong> " + escapeHtml(slide.avoid) + "</p>" : "") +
              (slide.aim ? "<p><strong>Professional habit.</strong> " + escapeHtml(slide.aim) + "</p>" : "") +
              (slide.lens ? "<p>" + escapeHtml(slide.lens) + "</p>" : "")
            : "<p>The presenter is moving the lesson. This page will catch up.</p>") +
          '<div class="note">' +
            '<p class="kicker" style="color:var(--teal);margin:0">Write here \u2014 this phone only</p>' +
            '<textarea id="note">' + escapeHtml(notes[key] || "") + "</textarea>" +
          "</div>" +
        "</div>" +
        '<footer class="bar">' +
          '<p style="margin:0;font-size:0.95rem">The presenter moves the slides. Write in the box under the slide.</p>' +
        "</footer>";
      const ta = document.getElementById("note");
      if (ta) ta.oninput = () => {
        notes[key] = ta.value;
        sessionStorage.setItem("cft-notes", JSON.stringify(notes));
      };
    }

    async function tick() {
      if (!joined || !code) return;
      try {
        const snap = await pullLive();
        if (!snap) return;
        const changed = !live || live.moduleId !== snap.moduleId || live.slide !== snap.slide;
        live = snap;
        if (changed) renderStage();
      } catch (e) {}
    }

    (async function start() {
      for (const url of CONTENT_URLS) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) continue;
          content = await res.json();
          if (content && Array.isArray(content.modules)) break;
          content = null;
        } catch (e) { content = null; }
      }
      if (!content) {
        app.innerHTML = "<p style='padding:2rem'>Could not load the lesson materials. Check the phone connection and scan again.</p>";
        return;
      }
      if (code.length === 6) {
        try { live = await pullLive(); } catch (e) { live = null; }
      }
      renderJoin();
      setInterval(tick, 1200);
    })();
  </script>
</body>
</html>
